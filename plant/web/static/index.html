<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plant Life Support</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4/dist/chart.umd.min.js"></script>
  <style>
    /* ── Reset & tokens ─────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d1117;
      --surface:   #161b22;
      --border:    #30363d;
      --text:      #e6edf3;
      --muted:     #8b949e;
      --green:     #3fb950;
      --blue:      #58a6ff;
      --orange:    #d29922;
      --red:       #f85149;
      --radius:    10px;
      --gap:       16px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ── Layout ─────────────────────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: sticky; top: 0; z-index: 10;
    }

    header h1 { font-size: 17px; font-weight: 600; }
    header h1 span { font-size: 20px; margin-right: 6px; }

    #header-right { display: flex; align-items: center; gap: 12px; }

    #clock { color: var(--muted); font-variant-numeric: tabular-nums; }

    .badge {
      font-size: 11px; font-weight: 600; padding: 2px 8px;
      border-radius: 20px; text-transform: uppercase; letter-spacing: .04em;
    }
    .badge-sim  { background: #1f3a5f; color: var(--blue); }
    .badge-hw   { background: #1a3a24; color: var(--green); }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: var(--gap);
      display: grid;
      gap: var(--gap);
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-areas:
        "stat-moisture stat-temp stat-light"
        "photo         photo     log"
        "chart         chart     log";
    }

    @media (max-width: 800px) {
      main {
        grid-template-columns: 1fr 1fr;
        grid-template-areas:
          "stat-moisture stat-temp"
          "stat-light    stat-light"
          "photo         photo"
          "chart         chart"
          "log           log";
      }
    }

    /* ── Cards ──────────────────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      overflow: hidden;
    }

    .card-label {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .06em; color: var(--muted); margin-bottom: 8px;
    }

    .card-value {
      font-size: 36px; font-weight: 700; line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .card-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

    /* ── Stat cards ─────────────────────────────────────────────────────── */
    #stat-moisture { grid-area: stat-moisture; }
    #stat-temp     { grid-area: stat-temp;     }
    #stat-light    { grid-area: stat-light;    }

    .moisture-bar-wrap {
      height: 6px; background: var(--border); border-radius: 3px;
      margin-top: 10px; overflow: hidden;
    }
    .moisture-bar {
      height: 100%; border-radius: 3px;
      background: var(--green);
      transition: width .6s ease, background .4s;
    }

    /* ── Photo card ─────────────────────────────────────────────────────── */
    #photo-card { grid-area: photo; }
    #photo-card img {
      width: 100%; border-radius: 6px; display: block;
      max-height: 280px; object-fit: cover; background: var(--border);
      min-height: 160px;
    }
    #photo-ts { font-size: 11px; color: var(--muted); margin-top: 6px; }
    #plant-desc {
      margin-top: 8px; font-size: 13px; color: var(--muted);
      font-style: italic; line-height: 1.5;
    }

    /* ── Chart ──────────────────────────────────────────────────────────── */
    #chart-card { grid-area: chart; }
    #chart-card canvas { max-height: 220px; }

    /* ── Reasoning log ──────────────────────────────────────────────────── */
    #log-card {
      grid-area: log;
      display: flex; flex-direction: column;
    }
    #log-card .card-label { flex-shrink: 0; }
    #log-list {
      flex: 1; overflow-y: auto; max-height: 520px;
      display: flex; flex-direction: column; gap: 10px;
    }

    .log-entry {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12px;
    }
    .log-entry-header {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 6px; flex-wrap: wrap;
    }
    .log-ts { color: var(--muted); font-variant-numeric: tabular-nums; }
    .log-chip {
      font-size: 10px; font-weight: 700; padding: 1px 6px;
      border-radius: 4px; text-transform: uppercase;
    }
    .chip-water  { background: #1f3a5f; color: var(--blue);   }
    .chip-nowater{ background: #2a1f2d; color: var(--muted);  }
    .chip-light  { background: #3a2a00; color: var(--orange); }
    .chip-fallback{ background: #3a1a1a; color: var(--red);   }
    .log-reasoning { color: var(--text); line-height: 1.5; }

    /* ── Controls ───────────────────────────────────────────────────────── */
    #controls {
      position: fixed; bottom: 20px; right: 20px;
      display: flex; flex-direction: column; gap: 8px;
      z-index: 20;
    }

    .btn {
      padding: 10px 18px; border-radius: 8px; border: none;
      font-size: 13px; font-weight: 600; cursor: pointer;
      transition: opacity .15s, transform .1s;
    }
    .btn:active { transform: scale(.96); }
    .btn:disabled { opacity: .4; cursor: not-allowed; }

    .btn-water { background: var(--blue);  color: #0d1117; }
    .btn-light { background: var(--orange); color: #0d1117; }
    .btn-cycle { background: var(--green); color: #0d1117; }

    /* ── Status light ───────────────────────────────────────────────────── */
    .dot {
      display: inline-block; width: 8px; height: 8px;
      border-radius: 50%; margin-right: 5px;
    }
    .dot-on  { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .dot-off { background: var(--border); }

    /* ── Toast ──────────────────────────────────────────────────────────── */
    #toast {
      position: fixed; bottom: 80px; right: 20px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 16px; font-size: 13px;
      opacity: 0; transition: opacity .3s; pointer-events: none;
      max-width: 260px;
    }
    #toast.show { opacity: 1; }

    /* ── Skeleton / loading ─────────────────────────────────────────────── */
    .skeleton {
      background: linear-gradient(90deg, var(--border) 25%, #2a3040 50%, var(--border) 75%);
      background-size: 400% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 4px; height: 1em; display: inline-block; width: 80px;
    }
    @keyframes shimmer { 0%{background-position:100% 0} 100%{background-position:-100% 0} }
  </style>
</head>
<body>

<header>
  <h1><span>🌿</span>Plant Life Support</h1>
  <div id="header-right">
    <span id="mode-badge" class="badge badge-sim">sim</span>
    <span id="clock">--:--:--</span>
  </div>
</header>

<main>
  <!-- Moisture -->
  <div class="card" id="stat-moisture">
    <div class="card-label">Soil Moisture</div>
    <div class="card-value" id="moisture-val">—</div>
    <div class="card-sub" id="moisture-raw">ADC —</div>
    <div class="moisture-bar-wrap">
      <div class="moisture-bar" id="moisture-bar" style="width:0%"></div>
    </div>
  </div>

  <!-- Temperature -->
  <div class="card" id="stat-temp">
    <div class="card-label">Temperature</div>
    <div class="card-value" id="temp-val">—</div>
    <div class="card-sub">DS18B20 · 1-Wire</div>
  </div>

  <!-- Light -->
  <div class="card" id="stat-light">
    <div class="card-label">Grow Light</div>
    <div class="card-value" style="font-size:24px; margin-top:4px;" id="light-val">—</div>
    <div class="card-sub" id="light-sub">—</div>
  </div>

  <!-- Photo -->
  <div class="card" id="photo-card">
    <div class="card-label">Latest Photo</div>
    <img id="plant-img" src="" alt="Plant photo" />
    <div id="photo-ts">—</div>
    <div id="plant-desc">—</div>
  </div>

  <!-- Chart -->
  <div class="card" id="chart-card">
    <div class="card-label">Soil Moisture History</div>
    <canvas id="moisture-chart"></canvas>
  </div>

  <!-- Reasoning log -->
  <div class="card" id="log-card">
    <div class="card-label">Reasoning Log</div>
    <div id="log-list"><p style="color:var(--muted)">Loading…</p></div>
  </div>
</main>

<!-- Manual controls -->
<div id="controls">
  <button class="btn btn-cycle" onclick="triggerCycle()">⚡ Run Now</button>
  <button class="btn btn-water" onclick="manualWater()">💧 Water 3s</button>
  <button class="btn btn-light" id="light-btn" onclick="toggleLight()">💡 Toggle Light</button>
</div>

<div id="toast"></div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let lightOn = false;
let chart = null;
const REFRESH_MS = 30_000;

// ── Clock ──────────────────────────────────────────────────────────────────
function tickClock() {
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString();
}
setInterval(tickClock, 1000);
tickClock();

// ── Toast ──────────────────────────────────────────────────────────────────
function toast(msg, ms = 2500) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), ms);
}

// ── Fetch helpers ──────────────────────────────────────────────────────────
async function api(method, path, body) {
  const opts = { method, headers: {'Content-Type': 'application/json'} };
  if (body !== undefined) opts.body = JSON.stringify(body);
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

// ── Render status ──────────────────────────────────────────────────────────
function renderStatus(data) {
  // Mode badge
  const badge = document.getElementById('mode-badge');
  if (data.mode === 'hardware') {
    badge.textContent = 'hw';
    badge.className = 'badge badge-hw';
  } else {
    badge.textContent = 'sim';
    badge.className = 'badge badge-sim';
  }

  lightOn = data.light_on;
  renderLight(lightOn);

  const c = data.latest;
  if (!c) return;

  // Moisture
  const pct = c.soil_pct !== null ? c.soil_pct.toFixed(1) : '—';
  document.getElementById('moisture-val').textContent = pct + (c.soil_pct !== null ? '%' : '');
  document.getElementById('moisture-raw').textContent = c.soil_raw !== null ? `ADC ${c.soil_raw} / 1023` : 'ADC —';
  const bar = document.getElementById('moisture-bar');
  const pctNum = c.soil_pct ?? 0;
  bar.style.width = pctNum + '%';
  bar.style.background = pctNum < 25 ? 'var(--red)' : pctNum < 45 ? 'var(--orange)' : 'var(--green)';

  // Temperature
  const t = c.temp_celsius !== null ? c.temp_celsius.toFixed(1) + ' °C' : '—';
  document.getElementById('temp-val').textContent = t;

  // Photo
  if (c.photo_url) {
    const img = document.getElementById('plant-img');
    // Append cache-buster so the browser doesn't serve a stale placeholder
    img.src = c.photo_url + '?v=' + c.id;
  }
  document.getElementById('photo-ts').textContent =
    c.ts ? 'Captured ' + new Date(c.ts).toLocaleString() : '';
  document.getElementById('plant-desc').textContent = c.plant_description || '';
}

function renderLight(on) {
  const val = document.getElementById('light-val');
  const sub = document.getElementById('light-sub');
  val.innerHTML = `<span class="dot ${on ? 'dot-on' : 'dot-off'}"></span>${on ? 'ON' : 'OFF'}`;
  sub.textContent = on ? 'Growing…' : 'Resting';
  document.getElementById('light-btn').textContent = on ? '💡 Light Off' : '💡 Light On';
}

// ── Render chart ───────────────────────────────────────────────────────────
function renderChart(cycles) {
  // cycles are newest-first; reverse for chronological order
  const ordered = [...cycles].reverse();
  const labels = ordered.map(c => {
    const d = new Date(c.ts);
    return d.getHours().toString().padStart(2,'0') + ':' +
           d.getMinutes().toString().padStart(2,'0');
  });
  const moisture = ordered.map(c => c.soil_pct);
  const watered  = ordered.map(c => c.final_water ? c.soil_pct : null);

  if (chart) {
    chart.data.labels = labels;
    chart.data.datasets[0].data = moisture;
    chart.data.datasets[1].data = watered;
    chart.update('none');
    return;
  }

  const ctx = document.getElementById('moisture-chart').getContext('2d');
  chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [
        {
          label: 'Moisture %',
          data: moisture,
          borderColor: '#3fb950',
          backgroundColor: 'rgba(63,185,80,.12)',
          fill: true,
          tension: .35,
          pointRadius: 3,
          pointHoverRadius: 5,
        },
        {
          label: 'Watered',
          data: watered,
          borderColor: 'transparent',
          backgroundColor: '#58a6ff',
          pointStyle: 'triangle',
          pointRadius: 7,
          pointHoverRadius: 9,
          showLine: false,
        },
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      plugins: {
        legend: { labels: { color: '#8b949e', boxWidth: 12, font: { size: 11 } } },
        tooltip: { mode: 'index', intersect: false },
      },
      scales: {
        x: {
          ticks: { color: '#8b949e', maxTicksLimit: 12, font: { size: 10 } },
          grid:  { color: '#21262d' },
        },
        y: {
          min: 0, max: 100,
          ticks: {
            color: '#8b949e', font: { size: 10 },
            callback: v => v + '%',
          },
          grid: { color: '#21262d' },
        },
      },
    },
  });
}

// ── Render reasoning log ───────────────────────────────────────────────────
function renderLog(cycles) {
  const list = document.getElementById('log-list');
  if (!cycles.length) {
    list.innerHTML = '<p style="color:var(--muted)">No cycles recorded yet.</p>';
    return;
  }
  list.innerHTML = cycles.map(c => {
    const ts = c.ts ? new Date(c.ts).toLocaleString() : '—';
    const moisture = c.soil_pct !== null ? c.soil_pct.toFixed(0) + '%' : '—';
    const temp = c.temp_celsius !== null ? c.temp_celsius.toFixed(1) + '°C' : '—';

    const chips = [];
    if (c.final_water)
      chips.push(`<span class="log-chip chip-water">💧 ${c.final_water_secs?.toFixed(0)}s</span>`);
    else
      chips.push(`<span class="log-chip chip-nowater">No water</span>`);
    if (c.final_light_on)
      chips.push(`<span class="log-chip chip-light">💡 Light on</span>`);
    if (c.used_fallback)
      chips.push(`<span class="log-chip chip-fallback">⚠ Fallback</span>`);

    const reasoning = escHtml(c.ai_reasoning || '—');

    return `
      <div class="log-entry">
        <div class="log-entry-header">
          <span class="log-ts">${ts}</span>
          <span style="color:var(--muted)">${moisture} · ${temp}</span>
          ${chips.join('')}
        </div>
        <div class="log-reasoning">${reasoning}</div>
      </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Refresh ────────────────────────────────────────────────────────────────
async function refresh() {
  try {
    const [status, cycles] = await Promise.all([
      api('GET', '/api/status'),
      api('GET', '/api/cycles?limit=48'),
    ]);
    renderStatus(status);
    renderChart(cycles);
    renderLog(cycles);
  } catch (e) {
    console.error('Refresh error:', e);
  }
}

// ── Manual controls ────────────────────────────────────────────────────────
async function manualWater() {
  try {
    const r = await api('POST', '/api/water', { seconds: 3 });
    toast(`💧 Watered for ${r.watered_seconds}s`);
    setTimeout(refresh, 1500);
  } catch (e) { toast('Error: ' + e.message); }
}

async function toggleLight() {
  try {
    const r = await api('POST', '/api/light', { on: !lightOn });
    lightOn = r.light_on;
    renderLight(lightOn);
    toast(`💡 Light ${lightOn ? 'ON' : 'OFF'}`);
  } catch (e) { toast('Error: ' + e.message); }
}

async function triggerCycle() {
  try {
    await api('POST', '/api/cycle');
    toast('⚡ Cycle started — refreshing in 3s…');
    setTimeout(refresh, 3000);
  } catch (e) { toast('Error: ' + e.message); }
}

// ── Boot ───────────────────────────────────────────────────────────────────
refresh();
setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
